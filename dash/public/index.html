<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mambo SB | Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Outfit', sans-serif; background: #06060a; color: #fff; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 15% 20%, rgba(129,140,248,0.15), transparent 45%), radial-gradient(circle at 85% 30%, rgba(168,85,247,0.12), transparent 45%), radial-gradient(circle at 50% 90%, rgba(56,189,248,0.08), transparent 50%), #06060a; animation: bgShift 20s ease-in-out infinite alternate; }
  @keyframes bgShift { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
  .hidden { display: none !important; }
  .app { position: relative; z-index: 1; display: flex; height: 100vh; }
  
  .sidebar { width: 260px; background: rgba(10,10,18,0.8); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05); padding: 30px 20px; display: flex; flex-direction: column; gap: 8px; }
  .brand { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #c4b5fd, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
  .nav-item { padding: 12px 16px; border-radius: 12px; color: #aaaacc; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
  .nav-item:hover, .nav-item.active { background: rgba(129,140,248,0.15); color: #fff; }
  
  .main { flex: 1; padding: 40px; overflow-y: auto; }
  .page { display: none; animation: fade 0.3s ease; max-width: 1000px; margin: 0 auto; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .panel { background: rgba(20,20,30,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .panel h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; color: #e0e0ff; }
  
  .profile-header { display: flex; align-items: center; gap: 20px; }
  .profile-header img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #818cf8; box-shadow: 0 0 15px rgba(129,140,248,0.5); }
  .profile-info h1 { font-size: 1.8rem; font-weight: 700; }
  .profile-info p { color: #8888aa; font-size: 0.9rem; }
  
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 0.75rem; color: #8888aa; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
  .field input, .field select, .field textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-family: inherit; font-size: 0.9rem; outline: none; transition: all 0.2s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.15); }
  
  .btn { padding: 14px 24px; background: linear-gradient(135deg, #818cf8, #6366f1); border: none; border-radius: 12px; color: #fff; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99,102,241,0.4); }
  .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  .btn-danger { background: rgba(255,60,60,0.1); border: 1px solid #ff3333; color: #ff6b6b; }

  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .preset { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .preset:hover, .preset.active { background: rgba(129,140,248,0.15); border-color: #818cf8; transform: translateY(-3px); }
  .preset span { font-size: 0.8rem; font-weight: 600; color: #e0e0ff; }

  .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
  .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
  .swatch:hover, .swatch.active { transform: scale(1.1); border-color: #fff; }

  .rpc-preview { background: #0a0a12; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; gap: 15px; margin-top: 15px; }
  .rpc-preview img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
  .rpc-preview .details h3 { font-size: 1.1rem; margin-bottom: 5px; }
  .rpc-preview .details p { color: #aaaacc; font-size: 0.85rem; }
  .rpc-buttons-preview { display: flex; gap: 10px; margin-top: 10px; }
  .fake-btn { padding: 8px 16px; background: #4f545c; color: #fff; border-radius: 4px; font-size: 0.8rem; font-weight: 600; display: inline-block; }

  .toasts { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(20,20,30,0.95); backdrop-filter: blur(10px); border: 1px solid #4ade80; color: #86efac; padding: 15px 20px; border-radius: 12px; font-weight: 600; animation: slideIn 0.3s; }
  .toast.err { border-color: #f87171; color: #fca5a5; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; padding: 15px; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .nav-item { white-space: nowrap; }
    .main { padding: 20px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div class="app">
  <div class="sidebar">
    <div class="brand">Mambo SB</div>
    <div class="nav-item active" onclick="showPage('account', this)">Account</div>
    <div class="nav-item" onclick="showPage('rpc', this)">Rich Presence</div>
    <div class="nav-item" onclick="showPage('stack', this)">Stacking</div>
    <div class="nav-item" onclick="showPage('hosting', this)">Hosting</div>
    <div class="nav-item" onclick="showPage('theme', this)">Theme</div>
    <div class="nav-item" onclick="showPage('settings', this)">Settings</div>
  </div>

  <div class="main">
    
    <div class="page active" id="page-account">
      <div class="panel">
        <h2>Account Overview</h2>
        <div class="profile-header">
          <img id="account-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png">
          <div class="profile-info">
            <h1 id="account-name">Loading...</h1>
            <p id="account-role">Role: User</p>
          </div>
        </div>
        <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="field"><label>Uptime</label><input id="account-uptime" readonly></div>
          <div class="field"><label>Commands Loaded</label><input id="account-cmds" readonly></div>
        </div>
      </div>
    </div>

    <div class="page" id="page-rpc">
      <div class="panel">
        <h2>Rich Presence</h2>
        <div class="preset-grid" id="preset-grid"></div>
        
        <div class="form-row">
          <div class="field"><label>App Name</label><input id="rpc-name" placeholder="Spotify"></div>
          <div class="field"><label>Activity Type</label>
            <select id="rpc-type">
              <option value="PLAYING">Playing</option>
              <option value="LISTENING">Listening</option>
              <option value="WATCHING">Watching</option>
              <option value="COMPETING">Competing</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Details</label><input id="rpc-details" placeholder="Line 2"></div>
          <div class="field"><label>State</label><input id="rpc-state" placeholder="Line 3"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Button 1 Label</label><input id="rpc-btn1-label" placeholder="Join"></div>
          <div class="field"><label>Button 1 URL</label><input id="rpc-btn1-url" placeholder="https://..."></div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn" onclick="applyRPC()">Apply RPC</button>
          <button class="btn btn-danger" onclick="clearRPC()">Clear RPC</button>
        </div>
        
        <h2 style="margin-top: 30px;">Live Preview</h2>
        <div class="rpc-preview">
          <img src="https://cdn.discordapp.com/embed/avatars/0.png" id="preview-avatar">
          <div class="details">
            <h3 id="preview-name">App Name</h3>
            <p id="preview-details">Details go here</p>
            <p id="preview-state">State goes here</p>
            <div class="rpc-buttons-preview" id="preview-buttons"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="page" id="page-stack">
      <div class="panel">
        <h2>RPC Stacking</h2>
        <p style="color:#8888aa; margin-bottom: 20px;">Add multiple activities to show on your profile simultaneously.</p>
        <button class="btn" onclick="applyStack()">Apply Stack</button>
        <button class="btn btn-danger" onclick="clearStack()">Clear Stack</button>
      </div>
    </div>

    <div class="page" id="page-hosting">
      <div class="panel">
        <h2>Host a Token</h2>
        <div class="field"><label>Discord Token</label><input id="host-token" type="password" placeholder="Paste token here..."></div>
        <button class="btn" onclick="addHost()">Start Hosting</button>
        <div id="active-hosts" style="margin-top: 20px;"></div>
      </div>
    </div>

    <div class="page" id="page-theme">
      <div class="panel">
        <h2>Theme Selection</h2>
        <div class="field"><label>Primary Color</label></div>
        <div class="color-swatches">
          <div class="swatch active" style="background: #a29bfe;" onclick="setColor('#a29bfe', this)"></div>
          <div class="swatch" style="background: #ff3333;" onclick="setColor('#ff3333', this)"></div>
          <div class="swatch" style="background: #00ffcc;" onclick="setColor('#00ffcc', this)"></div>
          <div class="swatch" style="background: #ffd700;" onclick="setColor('#ffd700', this)"></div>
          <div class="swatch" style="background: #ff00ff;" onclick="setColor('#ff00ff', this)"></div>
        </div>
        <div class="field"><label>Custom Hex</label><input id="custom-hex" placeholder="#a29bfe"></div>
        <button class="btn" onclick="saveTheme()">Save Theme</button>
      </div>
    </div>

    <div class="page" id="page-settings">
      <div class="panel">
        <h2>Settings</h2>
        <button class="btn btn-danger" onclick="doLogout()">Logout</button>
      </div>
    </div>

  </div>
</div>

<script>
  let themeColor = '#a29bfe';
  let me = null;
  let presetsData = [];

  function toast(msg, type = 'ok') {
    const wrap = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerText = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.remove(); }, 3000);
  }

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    if (name === 'hosting') loadHosts();
    if (name === 'theme') loadTheme();
    if (name === 'rpc') loadPresets();
  }

  async function loadProfile() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (data.success) {
        me = data;
        document.getElementById('account-avatar').src = data.user.avatar;
        document.getElementById('account-name').innerText = data.user.username;
        document.getElementById('account-role').innerText = 'Role: ' + data.role;
        document.getElementById('account-uptime').value = data.uptime + ' seconds';
        document.getElementById('account-cmds').value = data.cmds;
        
        document.getElementById('preview-avatar').src = data.user.avatar;
        
        if (data.rpc) {
          document.getElementById('rpc-name').value = data.rpc.name || '';
          document.getElementById('rpc-details').value = data.rpc.details || '';
          document.getElementById('rpc-state').value = data.rpc.state || '';
          document.getElementById('rpc-btn1-label').value = data.rpc.button1Label || '';
          document.getElementById('rpc-btn1-url').value = data.rpc.button1URL || '';
          updatePreview();
        }
      }
    } catch (e) { console.error(e); }
  }

  async function loadPresets() {
    try {
      const res = await fetch('/api/rpc/presets');
      const data = await res.json();
      if (data.success) {
        presetsData = data.presets;
        const grid = document.getElementById('preset-grid');
        grid.innerHTML = data.presets.map(p => `
          <div class="preset" onclick="selectPreset('${p.key}', this)">
            <span>${p.name}</span>
          </div>
        `).join('');
      }
    } catch (e) { console.error(e); }
  }

  function selectPreset(key, el) {
    document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
    if (el) el.classList.add('active');
    const preset = presetsData.find(p => p.key === key);
    if (preset) {
      document.getElementById('rpc-name').value = preset.name;
      document.getElementById('rpc-type').value = preset.type || 'PLAYING';
      updatePreview();
    }
  }

  function updatePreview() {
    const name = document.getElementById('rpc-name').value || 'App Name';
    const details = document.getElementById('rpc-details').value || 'Details go here';
    const state = document.getElementById('rpc-state').value || 'State goes here';
    const btn1l = document.getElementById('rpc-btn1-label').value;
    
    document.getElementById('preview-name').innerText = name;
    document.getElementById('preview-details').innerText = details;
    document.getElementById('preview-state').innerText = state;
    
    const btnWrap = document.getElementById('preview-buttons');
    if (btn1l) {
      btnWrap.innerHTML = '<div class="fake-btn">' + btn1l + '</div>';
    } else {
      btnWrap.innerHTML = '';
    }
  }

  document.getElementById('rpc-name').addEventListener('input', updatePreview);
  document.getElementById('rpc-details').addEventListener('input', updatePreview);
  document.getElementById('rpc-state').addEventListener('input', updatePreview);
  document.getElementById('rpc-btn1-label').addEventListener('input', updatePreview);

  async function applyRPC() {
    const body = {
      name: document.getElementById('rpc-name').value,
      type: document.getElementById('rpc-type').value,
      details: document.getElementById('rpc-details').value,
      state: document.getElementById('rpc-state').value,
      button1Label: document.getElementById('rpc-btn1-label').value,
      button1URL: document.getElementById('rpc-btn1-url').value
    };
    const res = await fetch('/api/rpc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.success) toast('RPC Applied Successfully');
    else toast('Failed to apply RPC', 'err');
  }

  async function clearRPC() {
    const res = await fetch('/api/rpc/clear', { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      toast('RPC Cleared');
      document.getElementById('rpc-name').value = '';
      document.getElementById('rpc-details').value = '';
      document.getElementById('rpc-state').value = '';
      document.getElementById('rpc-btn1-label').value = '';
      document.getElementById('rpc-btn1-url').value = '';
      updatePreview();
    }
  }

  async function applyStack() {
    const res = await fetch('/api/rpc/stack/start', { method: 'POST' });
    const data = await res.json();
    if (data.success) toast('Stack Applied');
    else toast('Ensure Primary is set first', 'err');
  }

  async function clearStack() {
    await fetch('/api/rpc/stack/clear', { method: 'POST' });
    toast('Stack Cleared');
  }

  async function addHost() {
    const token = document.getElementById('host-token').value;
    if (!token) return toast('Paste a token first', 'err');
    const res = await fetch('/api/hosting/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    const data = await res.json();
    if (data.ok) {
      toast('Client Started');
      document.getElementById('host-token').value = '';
      loadHosts();
    } else {
      toast(data.reason || 'Failed to start', 'err');
    }
  }

  async function loadHosts() {
    const res = await fetch('/api/hosting/clients');
    const data = await res.json();
    if (data.success) {
      const list = document.getElementById('active-hosts');
      if (!data.tokens.length) {
        list.innerHTML = '<p style="color:#8888aa;">No active clients.</p>';
      } else {
        list.innerHTML = data.tokens.map(t => `
          <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:10px;">
            <span>${t.token}</span>
            <button class="btn btn-danger" style="padding:8px 12px; font-size:0.8rem;" onclick="removeHost('${t.fullToken}')">Stop</button>
          </div>
        `).join('');
      }
    }
  }

  async function removeHost(token) {
    await fetch('/api/hosting/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    toast('Client Stopped');
    loadHosts();
  }

  function setColor(hex, el) {
    themeColor = hex;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('custom-hex').value = hex;
    document.documentElement.style.setProperty('--primary-color', hex);
  }

  async function saveTheme() {
    const hex = document.getElementById('custom-hex').value || themeColor;
    const res = await fetch('/api/theme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ color: hex })
    });
    const data = await res.json();
    if (data.success) toast('Theme saved successfully');
  }

  async function loadTheme() {
    const res = await fetch('/api/theme');
    const data = await res.json();
    if (data.success && data.theme.color) {
      setColor(data.theme.color);
    }
  }

  function doLogout() {
    fetch('/api/logout', { method: 'POST' }).then(() => {
      window.location.href = '/login';
    });
  }

  loadProfile();
  setInterval(loadProfile, 10000);
</script>
</body>
</html>
